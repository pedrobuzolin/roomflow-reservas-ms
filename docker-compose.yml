services:
  reservas:
    build: .
    image: roomflow-reservas
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/roomflow_reservas
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      USUARIOS_URL: http://host.docker.internal:8082
      SALAS_URL: http://host.docker.internal:8083
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: roomflow_reservas
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d roomflow_reservas"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - roomflow_reservas-data:/var/lib/postgresql/data

volumes:
  roomflow_reservas-data: